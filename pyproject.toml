[project]
name = "nova"
version = "0.1.0"
description = "Nonlinear OpenSees Visualization & Analysis"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nova", "meshrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Un warning nuovo è un errore: i due sotto sono di monte (starlette/anyio, non nostro codice)
# e si tacciono per messaggio, così il giorno che spariscono l'output non resta sporco.
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
